<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>VietPhish Lens</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #1c2430; --muted: #5f6b7a; --line: #e3e7ec; --soft: #f5f7fa;
      --safe: #1f8a4c; --safe-bg: #e8f5ee;
      --warn: #b86e00; --warn-bg: #fff4e0;
      --danger: #c62828; --danger-bg: #fdecea;
      --none: #8a96a3; --none-bg: #eef1f5;
      --btn: #1f5fbf; --btn-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16191e; --fg: #e8ecf1; --muted: #a3adb9; --line: #2c323a; --soft: #1f242b;
        --safe: #4cc47f; --safe-bg: #15291f;
        --warn: #f0a63a; --warn-bg: #2d2313;
        --danger: #ff6b5e; --danger-bg: #331816;
        --none: #7d8894; --none-bg: #232930;
        --btn: #4d8ef7; --btn-fg: #ffffff;
      }
    }
    * { box-sizing: border-box; }
    body { width: 340px; margin: 0; font: 15px/1.5 "Segoe UI", Roboto, Arial, sans-serif; color: var(--fg); background: var(--bg); }

    /* Dải đầu đổi màu theo kết luận */
    .top { height: 46px; background: var(--none); display: flex; align-items: center; justify-content: center; gap: 8px; color: #fff; font-weight: 700; letter-spacing: .02em; transition: background .3s; }
    .SAFE .top { background: var(--safe); }
    .SUSPICIOUS .top { background: var(--warn); }
    .DANGER .top { background: var(--danger); }
    .CHECKING .top { background: var(--btn); }
    .top .logo { width: 26px; height: 26px; border-radius: 8px; background: rgba(255,255,255,.22); display: grid; place-items: center; font-size: 16px; }

    main { padding: 10px 16px 12px; text-align: center; }
    .host { font-weight: 700; font-size: 16px; word-break: break-all; }

    /* Vòng tròn mức rủi ro */
    .ring { position: relative; width: 104px; height: 104px; margin: 6px auto 2px; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring .track { fill: none; stroke: var(--line); stroke-width: 12; }
    .ring .fill { fill: none; stroke: var(--none); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset .8s ease, stroke .3s; }
    .SAFE .ring .fill { stroke: var(--safe); }
    .SUSPICIOUS .ring .fill { stroke: var(--warn); }
    .DANGER .ring .fill { stroke: var(--danger); }
    .CHECKING .ring .fill { stroke: var(--btn); }
    .CHECKING .ring svg { animation: spin 1.1s linear infinite; }
    @keyframes spin { from { transform: rotate(-90deg); } to { transform: rotate(270deg); } }
    @media (prefers-reduced-motion: reduce) { .CHECKING .ring svg { animation: none; } .ring .fill { transition: none; } }
    .ring .inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .ring .sym { font-size: 38px; line-height: 1; font-weight: 700; color: var(--none); }
    .SAFE .ring .sym { color: var(--safe); }
    .SUSPICIOUS .ring .sym { color: var(--warn); }
    .DANGER .ring .sym { color: var(--danger); }
    .CHECKING .ring .sym { color: var(--btn); font-size: 34px; letter-spacing: 2px; }
    .ring .lvl { margin-top: 2px; font-size: 12px; color: var(--muted); font-weight: 600; }

    .title { font-size: 18px; font-weight: 700; line-height: 1.3; margin-top: 2px; }
    .SAFE .title { color: var(--safe); }
    .SUSPICIOUS .title { color: var(--warn); }
    .DANGER .title { color: var(--danger); }
    .advice { margin: 4px 0 0; color: var(--fg); font-size: 14px; line-height: 1.45; }

    .todo { margin: 8px auto 0; padding: 8px 12px; font-size: 14px; list-style: none; text-align: left; border-radius: 10px; background: var(--danger-bg); }
    .SUSPICIOUS .todo { background: var(--warn-bg); }
    .todo li { position: relative; padding-left: 22px; }
    .todo li + li { margin-top: 4px; }
    .todo li::before { content: "✕"; position: absolute; left: 2px; color: var(--danger); font-weight: 700; }

    .note { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: var(--soft); color: var(--muted); font-size: 13px; }

    /* Nút */
    .btn { display: block; width: 100%; margin-top: 8px; padding: 8px 12px; border-radius: 999px; border: 0; font: inherit; font-weight: 600; cursor: pointer; }
    .btn.primary { background: var(--btn); color: var(--btn-fg); }
    .btn.close { background: var(--danger); color: #fff; }
    .btn.ghost { background: var(--soft); color: var(--fg); border: 1px solid var(--line); }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn:focus-visible, summary:focus-visible { outline: 2px solid var(--btn); outline-offset: 2px; }
    .row { display: flex; gap: 8px; }
    .row .btn { flex: 1; font-size: 14px; }

    /* Chi tiết: lý do */
    .details { margin-top: 10px; text-align: left; }
    .details h3 { margin: 10px 0 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
    .details ul { margin: 0; padding-left: 18px; font-size: 14px; }
    .details li { margin-bottom: 6px; }
    .details ul.facts { list-style: none; padding: 0; }
    .facts li { display: flex; flex-direction: column; padding: 6px 10px; border-radius: 8px; background: var(--soft); border-left: 4px solid var(--none); }
    .facts li.good { border-left-color: var(--safe); }
    .facts li.warn { border-left-color: var(--warn); }
    .facts li.bad { border-left-color: var(--danger); }
    .facts .k { font-size: 12px; color: var(--muted); }

    details.tech { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; color: var(--muted); font-size: 13px; text-align: left; }
    details.tech summary { cursor: pointer; }
    details.tech label { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; cursor: pointer; }
    details.tech .info { margin-top: 8px; word-break: break-all; }
    [hidden] { display: none !important; }
  </style>
</head>
<body class="NONE" id="body">
  <div class="top"><div class="logo" aria-hidden="true">V</div><div>VietPhish Lens</div></div>

  <main role="status" aria-live="polite">
    <div class="host" id="host"></div>

    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 120 120">
        <circle class="track" cx="60" cy="60" r="52"></circle>
        <circle class="fill" id="ringFill" cx="60" cy="60" r="52"></circle>
      </svg>
      <div class="inner">
        <div class="sym" id="sym">…</div>
        <div class="lvl" id="lvl"></div>
      </div>
    </div>

    <div class="title" id="title">Đang mở…</div>
    <p class="advice" id="advice"></p>
    <ul class="todo" id="todo" hidden></ul>
    <div class="note" id="note" hidden></div>

    <button class="btn close" id="closeTab" hidden>Đóng trang này</button>
    <button class="btn primary" id="official" hidden></button>
    <button class="btn primary" id="toggle" hidden aria-expanded="false">Xem chi tiết +</button>

    <div class="details" id="details" hidden>
      <div id="factsBox" hidden>
        <h3>Thông tin trang</h3>
        <ul class="facts" id="facts"></ul>
      </div>
      <div id="why" hidden>
        <h3>Vì sao có kết luận này?</h3>
        <ul id="reasons"></ul>
      </div>
    </div>

    <div class="row">
      <button class="btn ghost" id="recheck">Kiểm tra lại</button>
      <button class="btn ghost" id="report">Báo kết quả sai</button>
    </div>

    <details class="tech">
      <summary>Dành cho người kỹ thuật</summary>
      <label><input type="checkbox" id="demo"> <span>Chế độ demo offline (dùng kết quả có sẵn, không gọi máy chủ)</span></label>
      <div class="info" id="tech"></div>
    </details>
  </main>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
